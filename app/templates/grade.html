<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="static/grade.css">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <main >
        <img src="static/abstract waves.png" class="background-image"  alt="">
        
        <div class="intro-title-div ">
            <img src="static/lib_logo4.png" class="fade-in first" alt="">
            <h1 class="fade-in second">مرحبا بك في مكتبة تسريع</h1>
            <p class="fade-in second">المكتبة الرقمية لجميع المصادر و المراجع لطلبة التسريع</p>

        </div>
        <form action="{{ url_for('routes.set_cookie')}}" method="get">
            <div class="login-buttons-div">
            <div class="button-div general-div fade-in third" >
                    <h2>الصف</h2>
                    <div class="option-button-div">
                        <button onclick="set_grade('1')" type="button">خامس علمي</button>
                        <input type="text" name="grade" hidden id="grade-input">
                        <button onclick="set_grade('0')" type="button" >ثاني متوسط</button>
                    </div>
                    <h2>نوع الدراسة</h2>
                    <div class="option-button-div">
                        <button onclick="set_study_type('1')" type="button">عربي</button>
                        <input type="text" name="study_type" hidden id="study-type-input">
                        <button onclick="set_study_type('0')" type="button">انكليزي</button>
                    </div>
                    <button type="submit" class="login-proceed-button" >موافق</button>
                </div>
            </div>
        </form>
    </main>
</body>
<script>
    function set_grade(grade){
        document.getElementById("grade-input").value = grade;
        b1 = document.querySelectorAll(".option-button-div button")[0];
        b2 = document.querySelectorAll(".option-button-div button")[1];

        if(grade == '1'){
            b1.style.backgroundColor = "var(--primary)";
            b2.style.backgroundColor = "var(--bg-light)";
        }else{
            b2.style.backgroundColor = "var(--primary)";
            b1.style.backgroundColor = "var(--bg-light)";
        }
    }
    
    function set_study_type(study_type){
        document.getElementById("study-type-input").value = study_type;
        b1 = document.querySelectorAll(".option-button-div button")[2];
        b2 = document.querySelectorAll(".option-button-div button")[3];
        if(study_type == '1'){
            b1.style.backgroundColor = "var(--primary)";
            b2.style.backgroundColor = "var(--bg-light)";
        }else{
            b2.style.backgroundColor = "var(--primary)";
            b1.style.backgroundColor = "var(--bg-light)";
        }
    }
    window.addEventListener('pageshow', (event) => {
    // This runs on normal loads, reloads, AND back/forward navigation
    set_grade('1');
    set_study_type('1');

    });
    
    
</script>
</html>
